    <title>Sentinel Security AI</title>
    <style>
      #error-container {
        display: none;
        padding: 20px;
        color: #f87171;
        background-color: #1e1b4b;
        height: 100vh;
        font-family: monospace;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('error-container');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerHTML += '<div>' + (e.error ? e.error.stack : e.message) + '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errBox = document.getElementById('error-container');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerHTML += '<div>' + (e.reason ? e.reason.stack || e.reason : 'Unhandled Promise Rejection') + '</div>';
        }
      });
    </script>
