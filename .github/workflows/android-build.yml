name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --ignore-scripts

      - name: Build Web Assets (React/Vite)
        run: npm run build

      - name: Sync Capacitor for Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Native Dependencies (WireGuard & Tor)
        run: |
          mkdir -p android/app/libs
          export ANDROID_HOME=$ANDROID_HOME || export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          echo "======================================"
          echo "1. Building WireGuard Android..."
          echo "======================================"
          git clone https://github.com/WireGuard/wireguard-android.git wireguard-src
          cd wireguard-src
          git submodule update --init --recursive
          ./gradlew :tunnel:assembleRelease --no-configuration-cache || true
          find . -type f -name "*.aar" -not -path "*/ui/*" -exec cp {} ../android/app/libs/wireguard-tunnel.aar \;
          cd ..
          rm -rf wireguard-src
          
          echo "======================================"
          echo "2. Building Tor Android..."
          echo "======================================"
          git clone https://github.com/guardianproject/tor-android.git tor-src
          cd tor-src
          git submodule update --init --recursive
          
          cat << 'EOF' > ../init.gradle
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  mavenCentral()
                  google()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://raw.githubusercontent.com/guardianproject/gpmaven/master' }
              }
          }
          EOF
          
          ./gradlew assembleRelease --init-script ../init.gradle --no-configuration-cache || true
          find . -type f -name "*.aar" -not -path "*/sample*/*" -exec cp {} ../android/app/libs/tor-android.aar \;
          cd ..
          rm -rf tor-src
          rm -f init.gradle
          
          echo "======================================"
          echo "Dependencies placed in libs directory:"
          ls -la android/app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Regenerate Gradle Wrapper
        working-directory: ./android
        run: gradle wrapper --gradle-version 8.14.3
        
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-guard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
